<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>39A 早午餐餐廳</title>
    <style>
        .about-header {
            background-color: #f9f9f9;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e0e0e0;
            color: #000;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #fff;
            color: #000;
            padding: 20px;
            position: relative;
        }

        .logo {
            width: 150px;
            height: 150px;
            background-color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .logo h1 {
            color: #fff;
            font-size: 48px;
            margin: 0;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            color: #000;
            text-decoration: none;
            font-weight: bold;
        }

        section {
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #000;
        }

        .about-content {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .about-text {
            flex: 1;
            padding-right: 20px;
        }

        .about-image img {
            width: 100%; /* 使圖片縮放 */
            max-width: 720px;
            height: auto;
            border-radius: 8px;
            cursor: pointer;
        }

        .menu-hint {
            margin-top: 12px;
            font-size: 14px;
            color: #666;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .gallery img {
            width: 100%;
            max-width: 600px;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
        }

        .map {
            margin-top: 20px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #f9f9f9;
            color: #000;
            margin-top: auto;
        }

        .menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 30px;
            cursor: pointer;
            z-index: 2;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background-color: #333;
            color: #fff;
            padding: 20px;
            transition: left 0.3s ease-in-out;
            z-index: 1;
        }

        .sidebar a {
            display: block;
            color: #fff;
            text-decoration: none;
            margin: 15px 0;
            font-size: 18px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
        }

        /* 放大圖片的樣式 */
        .modal {
            display: none; /* 隱藏放大視窗 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow: auto; /* 放大後可捲動 */
        }

        .modal img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 8px;
        }

        /* 手機版調整 */
        @media (max-width: 700px) {
            section {
                margin: 20px 12px;
                padding: 16px;
            }
            nav ul {
                flex-wrap: wrap;
                gap: 12px;
            }
            .logo {
                width: 110px;
                height: 110px;
            }
            .logo h1 {
                font-size: 34px;
            }
        }

    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>39A</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">主頁</a></li> 
                <li><a href="about.html">關於我們</a></li>
                <li><a href="specials.html">精選美味</a></li>
                <li><a href="menu.html">菜單介紹</a></li>
                <li><a href="social.html">粉專資訊</a></li>
            </ul>
        </nav>
        <span class="menu-btn" onclick="toggleSidebar()">☰</span>
    </header>

    <div class="sidebar" id="sidebar">
        <span class="close-btn" onclick="toggleSidebar()">×</span>
        <a href="index.html">主頁</a>
        <a href="about.html">關於我們</a>
        <a href="specials.html">精選美味</a>
        <a href="menu.html">菜單介紹</a>
        <a href="social.html">粉專資訊</a>
    </div>

    <section class="about-section">
        <h2>店內菜單</h2>
        <div class="about-image">
            <img src="menu-full.png" alt="39A 店內菜單" onclick="openModal(this)" />
        </div>
        <p class="menu-hint">點擊菜單可放大檢視</p>
    </section>

    <footer>
        <p>39A 早午餐餐廳</p>
    </footer>

    <!-- 放大圖片的 Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <img id="modalImage" src="" alt="放大圖片" />
    </div>

    <script>
        function toggleSidebar() {
            var sidebar = document.getElementById("sidebar");
            if (sidebar.style.left === "-250px") {
                sidebar.style.left = "0";
            } else {
                sidebar.style.left = "-250px";
            }
        }

        // 開啟放大圖片 Modal
        function openModal(imgElement) {
            var modal = document.getElementById("imageModal");
            var modalImg = document.getElementById("modalImage");
            modal.style.display = "flex"; // 顯示 Modal
            modalImg.src = imgElement.src; // 設定放大圖片的來源
        }

        // 關閉放大圖片 Modal
        function closeModal() {
            var modal = document.getElementById("imageModal");
            modal.style.display = "none"; // 隱藏 Modal
        }
    </script>
</body>
</html>
